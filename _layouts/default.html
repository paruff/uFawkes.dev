<!DOCTYPE html>
<html lang="{{ page.lang | default: "en-US" }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="icon" type="image/svg+xml" href="{{ '/design/marks/flame.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
    {% include custom-head.html %}
    {% feed_meta %}
  </head>
  <body>

    {% include header.html %}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {% unless page.layout == 'home' %}
      <footer class="site-footer h-card">
        <data class="u-url" href="{{ "/" | relative_url }}"></data>
        <div class="wrapper">
          <h2 class="footer-heading">{{ site.title | default: site.name }}</h2>
          <div class="footer-col-wrapper">
            <div class="footer-col footer-col-1">
              <ul class="contact-list">
                <li class="p-name">{{ site.title | default: site.name }}</li>
              </ul>
            </div>
            <div class="footer-col footer-col-2">
              <ul class="social-media-list"></ul>
            </div>
            <div class="footer-col footer-col-3">
              <p>{{ site.description }}</p>
            </div>
          </div>
        </div>
      </footer>
    {% endunless %}

  </body>
</html>
