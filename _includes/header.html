<header class="site-header" role="banner">
  <div class="site-header__inner">
    <a class="site-header__logo" href="{{ '/' | relative_url }}" aria-label="uFawkes home"><img class="site-header__mark" src="{{ '/design/marks/flame.svg' | relative_url }}" alt="" width="24" height="24">uFawkes</a>

    <button
      class="nav-toggle"
      aria-expanded="false"
      aria-controls="main-nav"
      aria-label="Open navigation">
      <span></span><span></span><span></span>
    </button>

    <nav id="main-nav" class="main-nav" aria-label="Main navigation">
      <ul class="main-nav__list">
        {% for item in site.data.navigation.main %}
          <li class="main-nav__item">
            {% if item.dropdown %}
              <p class="main-nav__group-title">{{ item.title }}</p>
              <ul class="main-nav__group-list">
                {% for child in item.children %}
                  <li>
                    <a
                      href="{{ child.url | relative_url }}"
                      class="main-nav__link main-nav__link--child"
                      {% if page.url == child.url %}aria-current="page"{% endif %}>
                      {{ child.title }}
                    </a>
                  </li>
                {% endfor %}
              </ul>
            {% elsif item.external %}
              <a
                href="{{ item.url }}"
                class="main-nav__link{% if item.accent %} main-nav__link--accent{% endif %}"
                target="_blank"
                rel="noopener noreferrer">
                {{ item.title }}
              </a>
            {% else %}
              <a
                href="{{ item.url | relative_url }}"
                class="main-nav__link"
                {% if page.url == item.url %}aria-current="page"{% endif %}>
                {{ item.title }}
              </a>
            {% endif %}
          </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>

<script>
  (function () {
    var toggle = document.querySelector(".nav-toggle");
    var nav = document.getElementById("main-nav");

    function setMenuState(open) {
      nav.classList.toggle("is-open", open);
      toggle.setAttribute("aria-expanded", String(open));
      toggle.setAttribute("aria-label", open ? "Close navigation" : "Open navigation");
    }

    if (toggle && nav) {
      toggle.addEventListener("click", function () {
        var open = toggle.getAttribute("aria-expanded") !== "true";
        setMenuState(open);
      });

      nav.addEventListener("click", function (event) {
        if (event.target.closest("a")) {
          setMenuState(false);
        }
      });

      document.addEventListener("click", function (event) {
        if (!event.target.closest(".site-header__inner") && toggle.getAttribute("aria-expanded") === "true") {
          setMenuState(false);
        }
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && toggle.getAttribute("aria-expanded") === "true") {
          setMenuState(false);
          toggle.focus();
        }
      });
    }
  })();
</script>
