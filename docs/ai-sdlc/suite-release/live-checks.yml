# Live-system signals for the suite status page.
#
# An acceptance criterion in acceptance.yml answers "is this release ready?".
# A live check answers a different question: "does the real thing run right now?".
# Each entry names a GitHub Actions workflow that starts a running system (a
# Docker Compose stack, a kind cluster) and checks it. `make status` reads the
# workflow's latest completed run on main:
#
#   success within max_age_hours   -> pass
#   success but older              -> stale  (a green run nobody re-ran is not evidence)
#   failure / timed out            -> fail   (with the steps that failed)
#   no workflow, or never run      -> none   (said plainly, with the issue to fix it)
#
# Nothing here changes whether a criterion passes; it is shown beside them.
# Add a repo's workflow here once it exists. `workflow: ""` means "none yet".

# --- uFawkesObs: three live workflows already run against real stacks -------
- id: obs-acceptance-full
  repo: uFawkesObs
  workflow: ci-acceptance-full.yml
  release: Obs 1.0
  title: Core, apps and DORA start, and the acceptance suite passes
  max_age_hours: 72 # runs on every push to main; 72h rides out a quiet weekend

- id: obs-acceptance-smoke
  repo: uFawkesObs
  workflow: ci-acceptance-smoke.yml
  release: Obs 1.0
  title: The core stack starts and answers its health endpoints
  max_age_hours: 72

- id: obs-chaos-nightly
  repo: uFawkesObs
  workflow: ci-chaos-nightly.yml
  release: Obs 1.0
  title: The core stack survives chaos (nightly)
  max_age_hours: 36

