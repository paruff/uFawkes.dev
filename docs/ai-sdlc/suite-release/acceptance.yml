# Machine-readable acceptance criteria for the suite release.
#
# spec.md stays the human source. `make status-check-drift` fails when an
# `#### AC-` heading in spec.md has no entry here, or the other way round.
# `make status` runs every `check: command` entry and writes the results to
# _data/suite_status.json (see docs/ai-sdlc/suite-status/spec.md, R1-R3).
#
# check: command  -> `run` is executed (60s timeout); exit 0 = pass. Checks that look
#                    at the board read $STATUS_ITEMS_JSON (see scripts/checks/).
# check: manual   -> `evidence` is VERIFIED, never just present: a link must resolve,
#                    a GitHub PR must be merged, an issue closed. Evidence older than
#                    30 days is "stale", not "pass". A link that is not a GitHub PR or
#                    issue also needs `evidence_date: YYYY-MM-DD`. No evidence = "manual".
# Live systems (does the real stack run right now?) are in live-checks.yml.
# AC-SUITE-01..03, AC-DOJO-01 and AC-OBS-02 are fully machine-checkable, so they run
# as commands. AC-SUITE-01's scope (public entry points) is the owner's 2026-10-02 call.
# Release order on the status page is the order of first appearance below.

