# .github/ISSUE_TEMPLATE/bug_report.yml
name: 🐛 Bug Report
description: Report a bug in uFawkes.dev (Jekyll site, observability platform)
title: "[Bug]: "
labels: ["bug"]
assignees: paruff
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the form below to help us investigate.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: e.g., Jekyll build fails on new page
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Jekyll
        - Observability
        - DORA
        - Observability Primer
        - Learn Guides
        - Documentation
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: uFawkes.dev Version / Tag
      placeholder: v1.0.0

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Output
      render: shell
