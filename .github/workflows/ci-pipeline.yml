name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Stage 0: Pre-flight ──────────────────────────────────────────────────
  preflight:
    name: Pre-flight
    uses: ./.github/workflows/reusable-preflight.yml

  # ─── Stage 1: Lint ───────────────────────────────────────────────────────
  lint:
    name: Lint
    needs: [preflight]
    uses: ./.github/workflows/reusable-lint.yml

  # ─── Stage 2: Build & Validate ───────────────────────────────────────────
  build:
    name: Build Site
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: DORA job start
        run: |
          echo "job-start:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "sha:${{ github.sha }}"
          echo "workflow:${{ github.workflow }}"
          echo "job:${{ github.job }}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      - name: Validate HTML
        run: bundle exec htmlproofer ./_site --disable-external --checks "Links,Images" --ignore-empty-mailto

      - name: Validate external links
        run: |
          bundle exec htmlproofer ./_site \
            --checks "Links" \
            --ignore-empty-mailto \
            --ignore-urls "/https:\/\/ufawkes\.dev\/.*/,/https:\/\/www\.linkedin\.com\/.*/,/https:\/\/github\.com\/paruff\/ufawkes(obs|pipe|dora|sec|devx)/" \
            --typhoeus '{"timeout":20,"followlocation":true}'

      - name: Spell check
        uses: crate-ci/typos@53821664afd79bb88fcdd22fdc2f49d8d3f6cac9 # v1
        with:
          files: "**/*.md"

      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jekyll-site
          path: _site/
          retention-days: 1

      - name: DORA job finish
        if: always()
        run: echo "job-finish:$(date -u +%Y-%m-%dT%H:%M:%SZ)"

  # ─── Stage 3: Security ───────────────────────────────────────────────────
  security:
    name: Security Scanning
    needs: [build]
    uses: ./.github/workflows/reusable-security-scanning.yml
    with:
      scan-type: all
      severity-threshold: MEDIUM
      fail-on-critical: true
      upload-sarif: true

  # ─── Stage 3b: Dependency Review ─────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    needs: [build]
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-dependency-review.yml
    with:
      fail-on-severity: high

  # ─── Stage 5: Quality — Accessibility ────────────────────────────────────
  accessibility:
    name: Accessibility Testing
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: DORA job start
        run: |
          echo "job-start:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "sha:${{ github.sha }}"
          echo "workflow:${{ github.workflow }}"
          echo "job:${{ github.job }}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: jekyll-site
          path: _site/

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"

      - name: Install pa11y-ci
        run: npm install -g pa11y-ci

      - name: Run axe-core accessibility audit
        run: |
          npx @axe-core/cli --EXIT --disable \
            color,scss Ignore,link[hreflang] \
            --tags wcag2a,wcag2aa,wcag21a,wcag21aa \
            --dir _site/ \
            --stdout 2>&1 | tee a11y-results.txt || true

          # Check for critical violations
          VIOLATIONS=$(grep -c "Violation" a11y-results.txt 2>/dev/null || echo "0")
          echo "Found $VIOLATIONS violation(s)"

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "## Accessibility Violations" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat a11y-results.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Run pa11y on key pages
        run: |
          mkdir -p pa11y-results

          PAGES=(
            "http://localhost:4000/"
            "http://localhost:4000/obs/"
            "http://localhost:4000/pipe/"
            "http://localhost:4000/dora/"
            "http://localhost:4000/sec/"
            "http://localhost:4000/devx/"
            "http://localhost:4000/learn/"
            "http://localhost:4000/blog/"
          )

          # Serve site in background
          cd _site && python3 -m http.server 4000 &
          sleep 3

          FAILED=0
          for page in "${PAGES[@]}"; do
            SLUG=$(echo "$page" | sed 's|http://localhost:4000||; s|/$||; s|/|_|g')
            SLUG=${SLUG:-index}
            echo "Testing: $page"

            pa11y --standard WCAG2AA \
              --reporter json \
              --timeout 30000 \
              --chromeLaunchConfig '{"args":["--no-sandbox"]}' \
              "$page" > "pa11y-results/${SLUG}.json" 2>&1 || true

            ERROR_COUNT=$(python3 -c "
          import json, sys
          try:
              data = json.load(open('pa11y-results/${SLUG}.json'))
              print(sum(1 for r in data if r.get('type') == 'error'))
          except: print(0)
          " 2>/dev/null || echo "0")

            echo "  Errors: $ERROR_COUNT"
            if [ "$ERROR_COUNT" -gt 0 ]; then
              FAILED=$((FAILED + ERROR_COUNT))
            fi
          done

          kill %1 2>/dev/null || true

          echo "### pa11y WCAG 2.1 AA Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Page | Errors |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          for f in pa11y-results/*.json; do
            PAGE=$(basename "$f" .json)
            ERRORS=$(python3 -c "
          import json
          try:
              data = json.load(open('$f'))
              print(sum(1 for r in data if r.get('type') == 'error'))
          except: print(0)
          " 2>/dev/null || echo "0")
            echo "| $PAGE | $ERRORS |" >> $GITHUB_STEP_SUMMARY
          done

          if [ "$FAILED" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **$FAILED total accessibility error(s) found**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: a11y-results
          path: pa11y-results/
          retention-days: 30

      - name: DORA job finish
        if: always()
        run: echo "job-finish:$(date -u +%Y-%m-%dT%H:%M:%SZ)"

  # ─── Gate: Pipeline Complete ─────────────────────────────────────────────
  pipeline-complete:
    name: Pipeline Complete
    needs: [preflight, lint, build, security, dependency-review, accessibility]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: DORA job start
        run: |
          echo "job-start:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "sha:${{ github.sha }}"
          echo "workflow:${{ github.workflow }}"
          echo "job:${{ github.job }}"

      - name: Check results
        run: |
          echo "=== Pipeline Results ==="
          echo "Preflight: ${{ needs.preflight.result }}"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Dependency Review: ${{ needs.dependency-review.result }}"
          echo "Accessibility: ${{ needs.accessibility.result }}"

          if [ "${{ needs.preflight.result }}" == "failure" ] || \
             [ "${{ needs.lint.result }}" == "failure" ] || \
             [ "${{ needs.build.result }}" == "failure" ] || \
             [ "${{ needs.security.result }}" == "failure" ] || \
             [ "${{ needs.dependency-review.result }}" == "failure" ] || \
             [ "${{ needs.accessibility.result }}" == "failure" ]; then
            echo "❌ Pipeline failed"
            exit 1
          fi

          echo "✅ Pipeline passed"

      - name: DORA pipeline finish
        if: always()
        run: |
          echo "pipeline-finish:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "pipeline-result:${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}"
