name: Reusable Security Scanning

on:
  workflow_call:
    inputs:
      scan-type:
        description: "Type of scan: all, secrets, vulnerabilities, dependencies, container"
        required: false
        type: string
        default: "all"
      scan-path:
        description: "Path to scan"
        required: false
        type: string
        default: "."
      severity-threshold:
        description: "Minimum severity to report (UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL)"
        required: false
        type: string
        default: "MEDIUM"
      fail-on-critical:
        description: "Fail workflow on critical vulnerabilities"
        required: false
        type: boolean
        default: true
      upload-sarif:
        description: "Upload results to GitHub Security tab"
        required: false
        type: boolean
        default: true
      gitleaks-config:
        description: "Path to gitleaks config"
        required: false
        type: string
        default: ".gitleaks.toml"

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: DORA job start
        run: |
          echo "job-start:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "sha:${{ github.sha }}"
          echo "workflow:${{ github.workflow }}"
          echo "job:${{ github.job }}"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history, so Gitleaks scans every commit rather than a range
          fetch-depth: 0

      # ─── Secret Scanning (Gitleaks) ─────────────────────────────────────
      # Runs the gitleaks CLI directly, not gitleaks/gitleaks-action. The
      # action failed on every PR here ("failed to scan Git repository:
      # stderr is not empty", exit 1) and `continue-on-error` hid it, so
      # the secret scan had not been running (#132). Same pinned, checksum-
      # verified binary as uFawkesPipe's reusable-security-scanning.yml.
      - name: Install gitleaks
        if: inputs.scan-type == 'all' || inputs.scan-type == 'secrets'
        run: |
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks_8.24.3_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.24.3_linux_x64.tar.gz gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks

      - name: Run secret scanning
        id: gitleaks
        if: inputs.scan-type == 'all' || inputs.scan-type == 'secrets'
        env:
          GITLEAKS_CONFIG: ${{ inputs.gitleaks-config }}
        run: |
          gitleaks detect \
            --source . \
            --config "${GITLEAKS_CONFIG}" \
            --redact -v \
            --report-format=sarif \
            --report-path=gitleaks-results.sarif

      - name: Upload Gitleaks results to GitHub Security
        if: always() && inputs.upload-sarif && (inputs.scan-type == 'all' || inputs.scan-type == 'secrets')
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: "gitleaks-results.sarif"
          category: "gitleaks"

      # ─── Vulnerability Scanning (Trivy FS) ─────────────────────────────
      # A table of HIGH and CRITICAL findings in the log first (shift-left
      # spec R8): the SARIF below fails the job but is unreadable in the log.
      - name: Show Trivy findings (table)
        if: inputs.scan-type == 'all' || inputs.scan-type == 'vulnerabilities'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: ${{ inputs.scan-path }}
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "0"

      - name: Run Trivy vulnerability scanner
        if: inputs.scan-type == 'all' || inputs.scan-type == 'vulnerabilities'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: ${{ inputs.scan-path }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: ${{ inputs.severity-threshold }}
          ignore-unfixed: true
          exit-code: ${{ inputs.fail-on-critical && '1' || '0' }}

      - name: Upload Trivy results to GitHub Security
        if: inputs.upload-sarif && (inputs.scan-type == 'all' || inputs.scan-type == 'vulnerabilities')
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-filesystem"

      # ─── Dependency Scanning ────────────────────────────────────────────
      - name: Check Python dependencies
        if: (inputs.scan-type == 'all' || inputs.scan-type == 'dependencies')
        run: |
          if [ -f "requirements.txt" ]; then
            echo "📦 Found requirements.txt — scanning dependencies..."
            pip install safety
            safety check --file=requirements.txt
          fi

      - name: Check Node dependencies
        if: (inputs.scan-type == 'all' || inputs.scan-type == 'dependencies')
        run: |
          if [ -f "package.json" ]; then
            echo "📦 Found package.json — running npm audit..."
            npm audit --audit-level=moderate
          fi

      # ─── Container Scanning ─────────────────────────────────────────────
      - name: Scan Dockerfiles
        if: inputs.scan-type == 'container'
        env:
          SCAN_PATH: ${{ inputs.scan-path }}
          SEVERITY: ${{ inputs.severity-threshold }}
        run: |
          echo "🔍 Scanning Dockerfiles..."
          DOCKERFILES=$(find "$SCAN_PATH" -type f -name "Dockerfile*" \
            -not -path "*/node_modules/*" \
            -not -path "*/vendor/*" | head -5)

          if [ -z "$DOCKERFILES" ]; then
            echo "⚠️  No Dockerfiles found"
            exit 0
          fi

          for dockerfile in $DOCKERFILES; do
            echo "📋 Scanning: $dockerfile"
            docker run --rm \
              -v "$GITHUB_WORKSPACE:/workspace" \
              aquasec/trivy config \
              --severity "$SEVERITY" \
              "/workspace/$dockerfile"
          done

      # ─── Summary ────────────────────────────────────────────────────────
      - name: Generate scan summary
        if: always()
        env:
          SCAN_TYPE: ${{ inputs.scan-type }}
          SEVERITY: ${{ inputs.severity-threshold }}
          FAIL_ON_CRITICAL: ${{ inputs.fail-on-critical }}
        run: |
          echo "### Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Type | $SCAN_TYPE |" >> $GITHUB_STEP_SUMMARY
          echo "| Severity Threshold | $SEVERITY |" >> $GITHUB_STEP_SUMMARY
          echo "| Fail on Critical | $FAIL_ON_CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scans Performed:**" >> $GITHUB_STEP_SUMMARY

          if [ "$SCAN_TYPE" = "all" ]; then
            echo "- ✅ Secret scanning (Gitleaks)" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Vulnerability scanning (Trivy FS)" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Dependency scanning" >> $GITHUB_STEP_SUMMARY
          elif [ "$SCAN_TYPE" = "secrets" ]; then
            echo "- ✅ Secret scanning (Gitleaks)" >> $GITHUB_STEP_SUMMARY
          elif [ "$SCAN_TYPE" = "vulnerabilities" ]; then
            echo "- ✅ Vulnerability scanning (Trivy FS)" >> $GITHUB_STEP_SUMMARY
          elif [ "$SCAN_TYPE" = "dependencies" ]; then
            echo "- ✅ Dependency scanning" >> $GITHUB_STEP_SUMMARY
          elif [ "$SCAN_TYPE" = "container" ]; then
            echo "- ✅ Container image scanning" >> $GITHUB_STEP_SUMMARY
          fi

      - name: DORA job finish
        if: always()
        run: echo "job-finish:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
