name: CI

on:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: DORA job start
        run: |
          echo "job-start:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "sha:${{ github.sha }}"
          echo "workflow:${{ github.workflow }}"
          echo "job:${{ github.job }}"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      - name: Validate HTML (broken links + alt text)
        run: bundle exec htmlproofer ./_site --disable-external --checks "Links,Images" --ignore-empty-mailto

      - name: Validate external links (200, timeout, redirects)
        run: |
          bundle exec htmlproofer ./_site \
            --checks "Links" \
            --ignore-empty-mailto \
            --ignore-urls "/https:\/\/ufawkes\.dev\/.*/,/https:\/\/www\.linkedin\.com\/.*/,/https:\/\/github\.com\/paruff\/ufawkes(obs|pipe|dora|sec|devx)/" \
            --typhoeus '{"timeout":20,"followlocation":true}'

      - name: Spell check Markdown
        uses: crate-ci/typos@v1
        with:
          files: "**/*.md"

      - name: DORA job finish
        if: always()
        run: echo "job-finish:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
