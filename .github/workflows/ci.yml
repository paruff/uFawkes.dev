name: CI

on:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: DORA job start
        run: |
          echo "job-start:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "sha:${{ github.sha }}"
          echo "workflow:${{ github.workflow }}"
          echo "job:${{ github.job }}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      - name: Validate HTML (broken links + alt text)
        run: bundle exec htmlproofer ./_site --disable-external --checks "Links,Images" --ignore-empty-mailto

      - name: Validate external links (200, timeout, redirects)
        run: |
          # The repo's own github.com links (nav, ai/, compatibility/) are
          # self-referential: GitHub returns 503 to non-browser user agents,
          # which flakes this check from CI (seen 2026-10-10). Ignored like
          # the own-domain and sibling-repo URLs above.
          bundle exec htmlproofer ./_site \
            --checks "Links" \
            --ignore-empty-mailto \
            --ignore-urls "/https:\/\/ufawkes\.dev\/.*/,/https:\/\/www\.linkedin\.com\/.*/,/https:\/\/github\.com\/paruff\/ufawkes(obs|pipe|dora|sec|devx)/,/https:\/\/github\.com\/paruff\/uFawkes\.dev\/.*/" \
            --typhoeus '{"timeout":20,"followlocation":true}'

      - name: Spell check Markdown
        uses: crate-ci/typos@53821664afd79bb88fcdd22fdc2f49d8d3f6cac9 # v1
        with:
          files: "**/*.md"

      - name: DORA job finish
        if: always()
        run: echo "job-finish:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
