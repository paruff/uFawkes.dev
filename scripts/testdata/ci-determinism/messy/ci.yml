name: CI
on: [push]
jobs:
  lint:
    uses: paruff/ufawkespipe/.github/workflows/reusable-lint.yml@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  test:
    uses: paruff/uFawkesPipe/.github/workflows/reusable-tests.yml@bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  hooks:
    runs-on: ubuntu-latest
    container: ubuntu:latest
    services:
      db:
        image: postgres:16
    steps:
      - uses: actions/checkout@v4
      - run: pre-commit run --all-files
      - name: Flaky
        continue-on-error: true
        run: make flaky
      - name: Quiet
        run: make quiet || true
      - name: Status (informational)
        continue-on-error: true
        run: make status
      - name: Guard
        run: grep -q ':latest' Dockerfile || exit 1
