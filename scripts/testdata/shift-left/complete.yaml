default_install_hook_types: [pre-commit, commit-msg, pre-push]
repos:
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.33.0
    hooks:
      - id: check-dependabot
      - id: check-github-workflows
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
  - repo: local
    hooks:
      - id: semgrep
        name: semgrep
        entry: semgrep
        language: python
        stages: [pre-push]
      - id: trivy
        name: trivy
        entry: scripts/require-tool.sh trivy
        language: script
        stages: [pre-push]
      - id: unit-tests
        name: unit tests
        entry: scripts/run-unit-tests.sh
        language: script
        stages: [pre-push]
      - id: conventional-commit
        name: commit msg
        entry: scripts/commit-msg.sh
        language: script
        stages: [commit-msg]
