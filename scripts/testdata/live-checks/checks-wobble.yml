# Fixture: a workflow whose runs listing is unstable between two reads
# (eventual consistency). The script must use the later read and say so.
checks:
  - repo: wobble
    workflow: wobble.yml
    purpose: the later of two disagreeing reads wins, loudly
    stale_after_hours: 30
