# Fixture list for scripts/test-live-checks.sh (LC_FILE).
checks:
  - repo: pass-ok
    workflow: pass.yml
    purpose: proves a healthy nightly shows pass
    starts_stack: true
    stale_after_hours: 30
  - repo: pass-ok
    workflow: flaky.yml
    purpose: a neutral run verifies nothing
    stale_after_hours: 30
  - repo: fail-steps
    workflow: boom.yml
    purpose: a red nightly reports its failed steps
    stale_after_hours: 30
  - repo: stale-old
    workflow: old.yml
    purpose: an old green run is stale, not pass
    stale_after_hours: 6
  - repo: none-yet
    workflow: never.yml
    purpose: a workflow that never ran shows none
    stale_after_hours: 30
  - repo: running-now
    workflow: busy.yml
    purpose: an in-flight run shows running
    stale_after_hours: 30
